apiVersion: v1
kind: Service
metadata:
  name: {{ include "products-observability-demo.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "products-observability-demo.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "products-observability-demo.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
