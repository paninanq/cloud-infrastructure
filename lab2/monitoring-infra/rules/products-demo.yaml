groups:
  - name: products-observability-demo
    interval: 15s
    rules:
      - alert: ProductsDemoHighErrorRate
        expr: |
          (
            sum(rate(products_demo_http_errors_total[5m]))
            / clamp_min(sum(rate(products_demo_http_requests_total[5m])), 0.001)
          ) > 0.05
          and sum(increase(products_demo_http_requests_total[5m])) > 0
        for: 30s
        labels:
          severity: warning
          service: products-observability-demo
        annotations:
          summary: Products demo has an elevated 5xx rate
          description: More than 5% of observed requests returned 5xx during the last five minutes.

      - alert: ProductsDemoTrafficBurst
        expr: sum(increase(products_demo_http_requests_total[2m])) > 20
        for: 0s
        labels:
          severity: info
          service: products-observability-demo
        annotations:
          summary: Products demo received a traffic burst
          description: More than 20 requests were observed during the last two minutes.

      - alert: ProductsDemoHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(products_demo_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 30s
        labels:
          severity: warning
          service: products-observability-demo
        annotations:
          summary: Products demo p95 latency is above one second
          description: The 5-minute p95 request duration is over one second.
